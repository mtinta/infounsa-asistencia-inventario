user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log.json  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name asistencia.infounsa.edu.pe inventario.infounsa.edu.pe;
        return 301 https://$host$request_uri;
    }

    # Asistencia API Proxy
    server {
        listen 443 ssl http2;
        server_name asistencia.infounsa.edu.pe;

        ssl_certificate /etc/nginx/certs/asistencia.crt;
        ssl_certificate_key /etc/nginx/certs/asistencia.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        # Protect authentication routes with rate limit
        location /auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://asistencia-api-prod:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://asistencia-api-prod:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Inventario API Proxy
    server {
        listen 443 ssl http2;
        server_name inventario.infounsa.edu.pe;

        ssl_certificate /etc/nginx/certs/inventario.crt;
        ssl_certificate_key /etc/nginx/certs/inventario.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location /auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://inventario-api-prod:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=general_limit burst=50 nodelay;
            proxy_pass http://inventario-api-prod:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
