services:
  inventario-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: inventario-api
    environment:
      NODE_ENV: development
      PORT: ${INVENTARIO_API_PORT:-43001}
      DATABASE_URL: ${INVENTARIO_DATABASE_URL:?INVENTARIO_DATABASE_URL is required}
      JWT_SECRET_INVENTARIO: ${JWT_SECRET_INVENTARIO:?JWT_SECRET_INVENTARIO is required}
    ports:
      - "${INVENTARIO_API_PORT:-43001}:${INVENTARIO_API_PORT:-43001}"
    volumes:
      - ./api/src:/app/src
      - ./api/package.json:/app/package.json
    depends_on:
      inventario-db:
        condition: service_healthy
    networks:
      - inventario-net

  inventario-db:
    image: mysql:8.4
    container_name: inventario-db
    environment:
      MYSQL_DATABASE: ${INVENTARIO_DB_NAME:-infounsa_inventario}
      MYSQL_USER: ${INVENTARIO_DB_USER:-infounsa}
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_DB_ROOT_PASSWORD:?INVENTARIO_DB_ROOT_PASSWORD is required}
    ports:
      - "${INVENTARIO_DB_PORT:-3307}:3306"
    volumes:
      - inventario-db-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${INVENTARIO_DB_USER:-infounsa} -p${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventario-net

  inventario-adminer:
    image: adminer:4
    container_name: inventario-adminer
    ports:
      - "${INVENTARIO_ADMINER_PORT:-8081}:8080"
    depends_on:
      - inventario-db
    networks:
      - inventario-net

volumes:
  inventario-db-data:

networks:
  inventario-net:
    driver: bridge
