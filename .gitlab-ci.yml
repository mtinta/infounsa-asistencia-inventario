# ==============================================================================
# PIPELINE DE INTEGRACIÓN Y DESPLIEGUE CONTINUO (CI/CD) - INFOUNSA
# ==============================================================================

stages:
  - validate
  - test
  - security
  - build
  - deploy

workflow:
  rules:
    # Los tags de release siempre deben crear un pipeline.
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
    # Las merge requests deben ejecutar las validaciones de seguridad.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Las ramas de integracion deben conservar evidencia de cada cambio.
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    # Solo ejecuta el pipeline si el commit contiene "[deploy-importante]" en el mensaje
    - if: $CI_COMMIT_MESSAGE =~ /\[deploy-importante\]/
    # De lo contrario, no ejecutar (ahorra minutos de runners en la nube)
    - when: never

# Plantillas de seguridad oficiales de GitLab
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

# Caché global para dependencias de Node.js
cache:
  key:
    files:
      - apps/asistencia/api/package.json
      - apps/inventario/api/package.json
  paths:
    - .npm/

# ==============================================================================
# ETAPA DE VALIDACIÓN ESTÁTICA Y COMPILACIÓN (VALIDATE)
# ==============================================================================

validate-asistencia-api:
  stage: validate
  image: node:24.16.0-alpine3.24
  script:
    - cd apps/asistencia/api
    - npm ci
    - npx prisma validate
    - npx prisma generate
    - npm run build
  rules:
    # Se ejecuta siempre al hacer push a ramas que contengan "asistencia" en su nombre
    - if: $CI_COMMIT_REF_NAME =~ /.*asistencia.*/
    # Se ejecuta en develop/main ante cambios en la carpeta
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/asistencia/api/**/*
        - packages/**/*
        - .gitlab-ci.yml

validate-inventario-api:
  stage: validate
  image: node:24.16.0-alpine3.24
  script:
    - cd apps/inventario/api
    - npm ci
