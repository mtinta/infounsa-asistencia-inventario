# ==============================================================================
# ETAPA DE COMPILACIÓN DE IMÁGENES DOCKER (BUILD)
# ==============================================================================

build-asistencia-api-docker:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull 
      -f infra/docker/asistencia-api/Dockerfile 
      -t "$CI_REGISTRY_IMAGE/asistencia-api:$CI_COMMIT_REF_SLUG" 
      -t "$CI_REGISTRY_IMAGE/asistencia-api:latest" 
      apps/asistencia
    - docker push "$CI_REGISTRY_IMAGE/asistencia-api:$CI_COMMIT_REF_SLUG"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push "$CI_REGISTRY_IMAGE/asistencia-api:latest"; fi
  rules:
    # Se compila docker solo en develop o main, si la rama tiene el nombre o cambios en asistencia
    - if: ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main") && $CI_COMMIT_REF_NAME =~ /.*asistencia.*/
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/asistencia/**/*
        - infra/docker/asistencia-api/**/*
        - .gitlab-ci.yml

build-inventario-api-docker:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull 
      -f infra/docker/inventario-api/Dockerfile 
      -t "$CI_REGISTRY_IMAGE/inventario-api:$CI_COMMIT_REF_SLUG" 
      -t "$CI_REGISTRY_IMAGE/inventario-api:latest" 
      apps/inventario
    - docker push "$CI_REGISTRY_IMAGE/inventario-api:$CI_COMMIT_REF_SLUG"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push "$CI_REGISTRY_IMAGE/inventario-api:latest"; fi
  rules:
    # Se compila docker solo en develop o main, si la rama tiene el nombre o cambios en inventario
    - if: ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main") && $CI_COMMIT_REF_NAME =~ /.*inventario.*/
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/inventario/**/*
        - infra/docker/inventario-api/**/*
        - .gitlab-ci.yml

build-desktop-windows:
  stage: build
  tags:
    - windows
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-installers.ps1 -OutputDir "$env:CI_PROJECT_DIR\artifacts\desktop-release"
  artifacts:
    name: "infounsa-desktop-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - artifacts/desktop-release/*.exe
      - artifacts/desktop-release/release-manifest.json
  rules:
    # Un tag semántico genera los instaladores que se adjuntarán al Release.
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/asistencia/desktop/**/*
        - apps/inventario/desktop/**/*
        - scripts/build-desktop-installers.ps1
        - .gitlab-ci.yml

release-desktop:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-desktop-windows
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - echo "Publicando release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "InfoUNSA $CI_COMMIT_TAG"
    description: "Instaladores de escritorio de Asistencia e Inventario. Consulte release-manifest.json para los hashes SHA-256."
    assets:
      links:
        - name: "Instaladores y manifiesto"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build-desktop-windows"
          link_type: "package"

# ==============================================================================
# ETAPA DE DESPLIEGUE (DEPLOY)
# ==============================================================================

deploy-staging:
  stage: deploy
  image: alpine:3.24.1
  environment:
    name: staging
    url: http://staging.infounsa.edu.pe
  only:
    - develop
  script:
    - echo "Conectando al servidor staging de InfoUNSA..."
    - echo "Actualizando contenedores..."
    - echo "Despliegue en Staging finalizado con éxito."

deploy-production:
  stage: deploy
  image: alpine:3.24.1
  environment:
    name: production
    url: http://infounsa.edu.pe
  only:
    - main
  when: manual
  script:
    - echo "Conectando al servidor producción..."
    - echo "Ejecutando actualización de producción..."
    - echo "Despliegue en Producción finalizado con éxito."
