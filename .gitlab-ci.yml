        - packages/**/*
        - .gitlab-ci.yml

validate-portal-general:
  stage: validate
  image: nginx:alpine
  script:
    - echo "Validando Portal General (Nginx static content)"
    - nginx -t -c /etc/nginx/nginx.conf
  rules:
    # Se ejecuta siempre al hacer push a ramas que contengan "portal-general" en su nombre
    - if: $CI_COMMIT_REF_NAME =~ /.*portal-general.*/
    # Se ejecuta en develop/main ante cambios en la carpeta
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/portal-general/**/*
        - .gitlab-ci.yml

validate-docs:
  stage: validate
  image: alpine:3.21
  script:
    - echo "Validando archivos de documentación..."
    - find docs/ -name "*.md" -type f
  rules:
    # Se ejecuta en ramas que contengan "docs" o "qa" en su nombre
    - if: $CI_COMMIT_REF_NAME =~ /.*docs.*/ || $CI_COMMIT_REF_NAME =~ /.*qa.*/
    # Se ejecuta en develop/main ante cambios en docs
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/**/*
        - .gitlab-ci.yml

# ==============================================================================
# ETAPA DE PRUEBAS DE INTEGRACIÓN (TEST)
# ==============================================================================

test-asistencia-api:
  stage: test
  image: node:24.16.0-alpine3.24
  script:
    - echo "Iniciando servidor Mock en segundo plano..."
    - node qa/mock-server.js &
    - sleep 2
    - echo "Ejecutando pruebas de integración Newman para Asistencia..."
    - npx -y newman run qa/postman/asistencia_api_collection.json --env-var baseUrl=http://127.0.0.1:3000 -r cli
  rules:
    # Se ejecuta en ramas feature y fix/bugfix relacionadas con asistencia
    - if: ($CI_COMMIT_REF_NAME =~ /^feature\/.*asistencia.*/ || $CI_COMMIT_REF_NAME =~ /^fix\/.*asistencia.*/ || $CI_COMMIT_REF_NAME =~ /^bugfix\/.*asistencia.*/)
    # Se ejecuta en develop ante cambios en la carpeta de asistencia o QA
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - apps/asistencia/**/*
        - qa/**/*
        - .gitlab-ci.yml

test-inventario-api:
  stage: test
  image: node:24.16.0-alpine3.24
  script:
    - echo "Iniciando servidor Mock en segundo plano..."
    - node qa/mock-server.js &
    - sleep 2
    - echo "Ejecutando pruebas de integración Newman para Inventario..."
    - npx -y newman run qa/postman/inventario_api_collection.json --env-var baseUrl=http://127.0.0.1:3001 -r cli
  rules:
    # Se ejecuta en ramas feature y fix/bugfix relacionadas con inventario
    - if: ($CI_COMMIT_REF_NAME =~ /^feature\/.*inventario.*/ || $CI_COMMIT_REF_NAME =~ /^fix\/.*inventario.*/ || $CI_COMMIT_REF_NAME =~ /^bugfix\/.*inventario.*/)
    # Se ejecuta en develop ante cambios en la carpeta de inventario o QA
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - apps/inventario/**/*
        - qa/**/*
        - .gitlab-ci.yml

# ==============================================================================
# ETAPA DE SEGURIDAD (SECURITY)
# ==============================================================================

security-npm-audit-asistencia-api:
  stage: security
  image: node:24.16.0-alpine3.24
  script:
    - cd apps/asistencia/api
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm audit --audit-level=high --json > npm-audit.json || true
    - cat npm-audit.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - apps/asistencia/api/npm-audit.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/asistencia/api/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/asistencia/api/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
      changes:
        - apps/asistencia/api/**/*

