services:
  # ============================================================================
  # CONTROL DE ASISTENCIA (AST)
  # ============================================================================
  asistencia-db:
    image: mysql:8.4
    container_name: asistencia-db
    environment:
      MYSQL_DATABASE: ${ASISTENCIA_DB_NAME:-infounsa_asistencia}
      MYSQL_USER: ${ASISTENCIA_DB_USER:-infounsa}
      MYSQL_PASSWORD: ${ASISTENCIA_DB_PASSWORD:?ASISTENCIA_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${ASISTENCIA_DB_ROOT_PASSWORD:?ASISTENCIA_DB_ROOT_PASSWORD is required}
    ports:
      - "${ASISTENCIA_DB_PORT:-3306}:3306"
    volumes:
      - ${INFOUNSA_CONTAINERS_PATH:-../containers}/asistencia/db-data-mysql:/var/lib/mysql
      # El esquema de Asistencia lo crea Prisma (`npx prisma db push`); los SQL de database/init quedaron desfasados.
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${ASISTENCIA_DB_USER:-infounsa} -p${ASISTENCIA_DB_PASSWORD:?ASISTENCIA_DB_PASSWORD is required} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asistencia-net

  asistencia-api:
    build:
      context: ./apps/asistencia
      dockerfile: ../../infra/docker/asistencia-api/Dockerfile
    container_name: asistencia-api
    environment:
      NODE_ENV: development
      PORT: ${ASISTENCIA_API_PORT:-43000}
      DATABASE_URL: ${ASISTENCIA_DATABASE_URL:?ASISTENCIA_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_RESET_PASSWORDS: "true"
      SEED_DEMO_DATA: "true"
    ports:
      - "${ASISTENCIA_API_PORT:-43000}:${ASISTENCIA_API_PORT:-43000}"
    volumes:
      - ./apps/asistencia/api/src:/app/src
      - asistencia-api-generated:/app/src/generated/prisma
      - ./apps/asistencia/api/prisma:/app/prisma:ro
      - ./apps/asistencia/api/package.json:/app/package.json
      - ./apps/asistencia/api/prisma.config.ts:/app/prisma.config.ts:ro
    depends_on:
      asistencia-db:
        condition: service_healthy
    networks:
      - asistencia-net

  asistencia-adminer:
    image: adminer:4
    container_name: asistencia-adminer
    ports:
      - "${ASISTENCIA_ADMINER_PORT:-8080}:8080"
    depends_on:
      - asistencia-db
    networks:
      - asistencia-net

  # ============================================================================
  # GESTIÓN DE INVENTARIO (INV)
  # ============================================================================
  inventario-db:
    image: mysql:8.4
    container_name: inventario-db
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${INVENTARIO_DB_NAME:-infounsa_inventario}
      MYSQL_USER: ${INVENTARIO_DB_USER:-infounsa}
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_DB_ROOT_PASSWORD:?INVENTARIO_DB_ROOT_PASSWORD is required}
    ports:
      - "${INVENTARIO_DB_PORT:-3307}:3306"
    volumes:
      - ${INFOUNSA_CONTAINERS_PATH:-../containers}/inventario/db-data-mysql:/var/lib/mysql
      - ./apps/inventario/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${INVENTARIO_DB_USER:-infounsa} -p${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventario-net

  inventario-api:
    build:
      context: ./apps/inventario
      dockerfile: ../../infra/docker/inventario-api/Dockerfile
    container_name: inventario-api
    environment:
      NODE_ENV: development
      PORT: ${INVENTARIO_API_PORT:-43001}
      DATABASE_URL: ${INVENTARIO_DATABASE_URL:?INVENTARIO_DATABASE_URL is required}
      JWT_SECRET_INVENTARIO: ${JWT_SECRET_INVENTARIO:?JWT_SECRET_INVENTARIO is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_RESET_PASSWORDS: "true"
      SEED_DEMO_DATA: "true"
    ports:
      - "${INVENTARIO_API_PORT:-43001}:${INVENTARIO_API_PORT:-43001}"
    volumes:
      - ./apps/inventario/api/src:/app/src
      - inventario-api-generated:/app/src/generated/prisma
      - ./apps/inventario/api/prisma:/app/prisma:ro
      - ./apps/inventario/api/package.json:/app/package.json
    depends_on:
      inventario-db:
        condition: service_healthy
    networks:
      - inventario-net

  inventario-adminer:
    image: adminer:4
    container_name: inventario-adminer
    ports:
      - "${INVENTARIO_ADMINER_PORT:-8081}:8080"
    depends_on:
      - inventario-db
    networks:
      - inventario-net

  # ============================================================================
  # PORTAL GENERAL (WEB)
  # ============================================================================
  portal-general:
    image: nginx:alpine
    container_name: portal-general
    ports:
      - "${PORTAL_PORT:-8000}:80"
    volumes:
      - ./apps/portal-general/frontend:/usr/share/nginx/html:ro
    networks:
      - portal-net

networks:
  asistencia-net:
    driver: bridge
  inventario-net:
    driver: bridge
  portal-net:
    driver: bridge

volumes:
  asistencia-api-generated:
  inventario-api-generated:
