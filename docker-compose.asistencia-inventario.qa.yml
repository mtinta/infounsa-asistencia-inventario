name: infounsa-asistencia-inventario-qa

services:
  asistencia-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${ASISTENCIA_DB_NAME:?ASISTENCIA_DB_NAME is required}
      MYSQL_USER: ${ASISTENCIA_DB_USER:?ASISTENCIA_DB_USER is required}
      MYSQL_PASSWORD: ${ASISTENCIA_DB_PASSWORD:?ASISTENCIA_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${ASISTENCIA_DB_ROOT_PASSWORD:?ASISTENCIA_DB_ROOT_PASSWORD is required}
    ports:
      - "${ASISTENCIA_QA_DB_PORT:-13306}:3306"
    volumes:
      - asistencia-qa-db-data:/var/lib/mysql
      - ./apps/asistencia/database/init/001_create_attendance_schema.sql:/docker-entrypoint-initdb.d/001_create_attendance_schema.sql:ro
      - ./apps/asistencia/database/init/002_align_prisma_mysql_schema.sql:/docker-entrypoint-initdb.d/002_align_prisma_mysql_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - asistencia-qa-net

  asistencia-api:
    build:
      context: ./apps/asistencia
      dockerfile: ../../infra/docker/asistencia-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: ${ASISTENCIA_API_PORT:-43000}
      DATABASE_URL: ${ASISTENCIA_DATABASE_URL:?ASISTENCIA_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_RESET_PASSWORDS: "true"
      DB_CONNECTION_LIMIT: ${ASISTENCIA_DB_CONNECTION_LIMIT:-10}
      DB_CONNECT_TIMEOUT_MS: ${ASISTENCIA_DB_CONNECT_TIMEOUT_MS:-5000}
      DB_ACQUIRE_TIMEOUT_MS: ${ASISTENCIA_DB_ACQUIRE_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${ASISTENCIA_DB_IDLE_TIMEOUT_MS:-60000}
      ASISTENCIA_ALLOWED_ORIGINS: ${ASISTENCIA_ALLOWED_ORIGINS:-http://localhost:43000}
    ports:
      - "${ASISTENCIA_API_PORT:-43000}:${ASISTENCIA_API_PORT:-43000}"
    depends_on:
      asistencia-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 43000) + '/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - asistencia-qa-net

  inventario-db:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${INVENTARIO_DB_NAME:?INVENTARIO_DB_NAME is required}
      MYSQL_USER: ${INVENTARIO_DB_USER:?INVENTARIO_DB_USER is required}
      MYSQL_PASSWORD: ${INVENTARIO_DB_PASSWORD:?INVENTARIO_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${INVENTARIO_DB_ROOT_PASSWORD:?INVENTARIO_DB_ROOT_PASSWORD is required}
    ports:
      - "${INVENTARIO_QA_DB_PORT:-13307}:3306"
    volumes:
      - inventario-qa-db-data:/var/lib/mysql
      - ./apps/inventario/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - inventario-qa-net

  inventario-api:
    build:
      context: ./apps/inventario
      dockerfile: ../../infra/docker/inventario-api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: ${INVENTARIO_API_PORT:-43001}
      DATABASE_URL: ${INVENTARIO_DATABASE_URL:?INVENTARIO_DATABASE_URL is required}
      JWT_SECRET_INVENTARIO: ${JWT_SECRET_INVENTARIO:?JWT_SECRET_INVENTARIO is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_RESET_PASSWORDS: "true"
      DB_CONNECTION_LIMIT: ${INVENTARIO_DB_CONNECTION_LIMIT:-10}
      DB_CONNECT_TIMEOUT_MS: ${INVENTARIO_DB_CONNECT_TIMEOUT_MS:-5000}
      DB_ACQUIRE_TIMEOUT_MS: ${INVENTARIO_DB_ACQUIRE_TIMEOUT_MS:-5000}
      DB_IDLE_TIMEOUT_MS: ${INVENTARIO_DB_IDLE_TIMEOUT_MS:-60000}
      INVENTARIO_ALLOWED_ORIGINS: ${INVENTARIO_ALLOWED_ORIGINS:-http://localhost:43001}
    ports:
      - "${INVENTARIO_API_PORT:-43001}:${INVENTARIO_API_PORT:-43001}"
    depends_on:
      inventario-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:' + (process.env.PORT || 43001) + '/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - inventario-qa-net

networks:
  asistencia-qa-net:
  inventario-qa-net:

volumes:
  asistencia-qa-db-data:
  inventario-qa-db-data:
